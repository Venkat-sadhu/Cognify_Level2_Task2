<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Password Strength Checker</h2>
        <p class="subtitle">Enter a password to analyze its strength.</p>
        
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Enter your password...">
            <span class="toggle-visibility" id="toggleBtn">Show</span>
        </div>

        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
        </div>

        <div class="feedback-text" id="feedbackText"></div>

        <ul class="criteria-list">
            <li id="length">At least 8 characters</li>
            <li id="uppercase">Contains uppercase letter</li>
            <li id="lowercase">Contains lowercase letter</li>
            <li id="number">Contains a number</li>
            <li id="special">Contains a special character</li>
        </ul>
    </div>

    <!-- Link to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
